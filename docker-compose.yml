# AgentHQ: everything starts with `docker compose up`.
# Copy .env.example to .env first and add an LLM key (or set LLM_PROVIDER=fake).

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agenthq
      POSTGRES_PASSWORD: agenthq
      POSTGRES_DB: agenthq
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agenthq"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    # Append-only file: the event streams survive a restart, which replay depends on.
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  repolens:
    build:
      context: ./docker/repolens
      # The RepoLens source code, read by the Dockerfile with COPY --from=repolens_src.
      additional_contexts:
        repolens_src: ${REPOLENS_PATH:-../RepoLens}
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Its own model, so RepoLens's answers don't use up the agents' daily quota on Groq's free tier.
      REPOLENS_GROQ_MODEL: ${REPOLENS_GROQ_MODEL:-openai/gpt-oss-20b}
    ports: ["8000:8000"]
    # The index is kept in a volume so a restart doesn't force a re-index.
    volumes: [repolens_data:/data]
    healthcheck:
      # The slim image has no curl, so use Python for the health check.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/status')"]
      interval: 10s
      start_period: 30s
      retries: 10

  # Builds the image for per-run sandbox containers (tests and linter run there), then exits.
  # The backend waits for it, so `docker compose up` always has a current sandbox image.
  sandbox-image:
    build: ./docker/sandbox
    image: agenthq-sandbox:latest
    command: ["true"]

  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      # Service names replace localhost inside the compose network.
      DATABASE_URL: postgresql+asyncpg://agenthq:agenthq@postgres:5432/agenthq
      REDIS_URL: redis://redis:6379/0
      REPOLENS_URL: http://repolens:8000
      WORKSPACES_DIR: /workspaces
      WORKSPACES_VOLUME: agenthq-workspaces
    ports: ["8080:8080"]
    volumes:
      # The backend starts sandbox containers next to itself through the host's Docker daemon.
      # Mounting the socket gives it full control of Docker: fine for a local tool, not for
      # multi-tenant hosting (see DECISIONS.md).
      - /var/run/docker.sock:/var/run/docker.sock
      - agenthq-workspaces:/workspaces
    depends_on:
      sandbox-image: {condition: service_completed_successfully}
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      repolens: {condition: service_healthy}

  frontend:
    build: ./frontend
    ports: ["3000:80"]
    depends_on: [backend]

volumes:
  pgdata:
  redisdata:
  repolens_data:
  # Fixed name (no project prefix) because the backend passes it to the sandbox containers it starts.
  agenthq-workspaces:
    name: agenthq-workspaces

server {
    listen 80;
    root /usr/share/nginx/html;

    # Look the backend up through Docker's DNS on every request (cached 10 s). A fixed proxy_pass
    # host is resolved once at startup, so recreating the backend container would leave nginx
    # pointing at its old address and answering 502.
    resolver 127.0.0.11 valid=10s;
    set $backend http://backend:8080;

    # Single-page app: every unknown path serves index.html.
    location / {
        try_files $uri /index.html;
    }

    # /api/runs -> backend /runs.
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend;
    }

    # Live event stream. WebSockets need the upgrade headers, and a long read timeout because a
    # quiet run can go minutes without an event.
    location /ws/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1h;
    }
}

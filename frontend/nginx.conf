server {
    listen 80;
    root /usr/share/nginx/html;

    # Single-page app: every unknown path serves index.html.
    location / {
        try_files $uri /index.html;
    }

    # /api/runs -> backend /runs (the trailing slash strips the /api prefix).
    location /api/ {
        proxy_pass http://backend:8080/;
    }

    # Live event stream. WebSockets need the upgrade headers, and a long read timeout because a
    # quiet run can go minutes without an event.
    location /ws/ {
        proxy_pass http://backend:8080/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1h;
    }
}

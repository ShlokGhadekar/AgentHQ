[project]
name = "agenthq"
version = "0.1.0"
description = "A multi-agent software team with a live control plane"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "redis>=5.0",
    "httpx>=0.27",
    "anthropic>=0.40",
    "openai>=1.50",
    "pyyaml>=6.0",
    "docker>=7.1",
    "PyGithub>=2.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "fakeredis>=2.26",
    "ruff==0.17.0",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agenthq*"]

[tool.setuptools.package-data]
agenthq = ["*.yaml"]

[tool.ruff]
line-length = 140

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
# Tests that need Docker are slow; run them explicitly with `pytest -m docker`.
markers = ["docker: needs a running Docker daemon and the agenthq-sandbox image"]
addopts = "-m 'not docker'"
